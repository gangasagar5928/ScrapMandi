<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ScrapMandi Delhi NCR - Sell, Buy, Recycle. Direct B2B scrap exchange connecting Mayapuri, Mundka, Bawana, Wazirpur, and Okhla yards with instant Dharam Kanta settlement." />
    <meta name="theme-color" content="#059669" />
    <title>ScrapMandi | Sell • Buy • Recycle — Turning Waste Into Value</title>

    <style>
      /* 4K Parallax & Scroll Reveal Animations */
      @keyframes fadeSlideIn {
        from {
          opacity: 0;
          transform: translateY(28px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes heroZoom {
        0% { transform: scale(1.0); }
        50% { transform: scale(1.06); }
        100% { transform: scale(1.0); }
      }

      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }

      @keyframes glowPulse {
        0%, 100% {
          filter: drop-shadow(0 0 15px rgba(34, 197, 94, 0.4));
        }
        50% {
          filter: drop-shadow(0 0 35px rgba(34, 197, 94, 0.8));
        }
      }

      .hero-bg-zoom {
        animation: heroZoom 24s ease-in-out infinite;
      }

      .logo-glow {
        animation: glowPulse 4s ease-in-out infinite;
      }

      .animate-float {
        animation: floatSoft 5s ease-in-out infinite;
      }

      /* Scroll reveal utility classes */
      .reveal-on-scroll {
        animation: fadeSlideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Initial app loading overlay */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #064e3b 0%, #022c22 45%, #020617 100%);
        color: #ffffff;
        z-index: 99999;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .loader-logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
        animation: floatSoft 3s ease-in-out infinite, glowPulse 3s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans min-h-screen selection:bg-emerald-500 selection:text-white">
    <div id="root">
      <!-- Loading Shell with Official Logo -->
      <div id="app-loader">
        <img src="/logo.png" alt="ScrapMandi" class="loader-logo mb-6" />
        <div class="flex items-center gap-2 font-black text-xl tracking-tight text-white">
          <span>Scrap<span style="color: #22c55e;">Mandi</span></span>
          <span style="font-size: 10px; background: rgba(34, 197, 94, 0.2); color: #4ade80; padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(34, 197, 94, 0.4);" class="font-mono">DELHI NCR</span>
        </div>
        <p style="font-size: 13px; color: #cbd5e1; margin-top: 8px; font-weight: 500; letter-spacing: 0.5px;">
          Sell • Buy • Recycle — Turning Waste Into Value
        </p>
        <div style="margin-top: 24px; width: 140px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden;">
          <div style="width: 50%; height: 100%; background: #22c55e; border-radius: 99px; animation: shimmer 1.5s infinite alternate ease-in-out;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
