<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23059669'><path d='M4.5 10.5C3.67 10.5 3 11.17 3 12s.67 1.5 1.5 1.5h15c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5h-15zM10.5 4.5C10.5 3.67 11.17 3 12 3s1.5.67 1.5 1.5v15c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5v-15z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ScrapMandi Delhi NCR - Direct B2B scrap yard trading for Mayapuri, Mundka, Bawana, Wazirpur, and Okhla. Real mandi bhav, Dharam Kanta weight slips, and verified settlement." />
    <meta name="theme-color" content="#059669" />
    <title>ScrapMandi Delhi NCR | Direct B2B Scrap Exchange</title>

    <style>
      /* Smooth animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }

      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      .animate-float {
        animation: floatSlow 4s ease-in-out infinite;
      }

      .animate-pulse-glow {
        animation: pulseGlow 3s ease-in-out infinite;
      }

      /* Initial app loading shell */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020617;
        color: #ffffff;
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }

      .loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans min-h-screen">
    <div id="root">
      <!-- Lightweight loading state until React hydrates -->
      <div id="app-loader">
        <div class="loader-spinner mb-4"></div>
        <div class="flex items-center gap-2 font-bold text-lg">
          <span>Scrap<span style="color: #10b981;">Mandi</span></span>
          <span style="font-size: 10px; background: rgba(16, 185, 129, 0.2); color: #34d399; padding: 2px 6px; border-radius: 4px;">DELHI NCR</span>
        </div>
        <p style="font-size: 12px; color: #94a3b8; margin-top: 6px;">Loading Delhi Scrap Exchange...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
