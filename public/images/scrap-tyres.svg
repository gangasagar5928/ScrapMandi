<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTyres" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="rubberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgTyres)" />

  <circle cx="350" cy="300" r="260" fill="#10b981" fill-opacity="0.1" filter="blur(60px)" />
  <circle cx="580" cy="340" r="200" fill="#0284c7" fill-opacity="0.1" filter="blur(50px)" />

  <!-- Heavy Truck Radial Tyre (TBR) -->
  <g transform="translate(180, 160)">
    <!-- Outer Tyre Circle -->
    <circle cx="140" cy="140" r="130" fill="url(#rubberGrad)" stroke="#475569" stroke-width="6" />
    <!-- Tread Grips (Dashed/Notched outer border) -->
    <circle cx="140" cy="140" r="124" fill="none" stroke="#64748b" stroke-width="8" stroke-dasharray="14 10" />
    <!-- Sidewall ring -->
    <circle cx="140" cy="140" r="90" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <!-- Wheel Rim Hole -->
    <circle cx="140" cy="140" r="50" fill="#090d16" stroke="#10b981" stroke-width="3" />
    <!-- Lug Nut Holes -->
    <circle cx="140" cy="108" r="6" fill="#cbd5e1" />
    <circle cx="168" cy="128" r="6" fill="#cbd5e1" />
    <circle cx="158" cy="160" r="6" fill="#cbd5e1" />
    <circle cx="122" cy="160" r="6" fill="#cbd5e1" />
    <circle cx="112" cy="128" r="6" fill="#cbd5e1" />
    <text x="108" y="145" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">TBR 10.20</text>
  </g>

  <!-- Second Stacked Tyre behind -->
  <g transform="translate(360, 130)">
    <circle cx="110" cy="110" r="100" fill="url(#rubberGrad)" stroke="#475569" stroke-width="4" opacity="0.8" />
    <circle cx="110" cy="110" r="70" fill="#0f172a" stroke="#334155" stroke-width="3" />
    <circle cx="110" cy="110" r="40" fill="#090d16" />
  </g>

  <!-- Crumb Rubber Powder Pile -->
  <g transform="translate(100, 390)">
    <ellipse cx="140" cy="40" rx="130" ry="30" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <!-- Rubber granules -->
    <circle cx="70" cy="30" r="3" fill="#64748b" />
    <circle cx="110" cy="25" r="4" fill="#94a3b8" />
    <circle cx="150" cy="35" r="3" fill="#64748b" />
    <circle cx="180" cy="28" r="4" fill="#94a3b8" />
    <circle cx="130" cy="15" r="3" fill="#cbd5e1" />
  </g>

  <!-- Glass Cullet (Kanch Tukda) Fragments (Shards) -->
  <g transform="translate(480, 240)">
    <polygon points="40,30 90,10 120,60 60,80" fill="url(#glassGrad)" opacity="0.85" stroke="#e0f2fe" stroke-width="2" />
    <polygon points="90,40 160,20 180,85 110,110" fill="#7dd3fc" opacity="0.75" stroke="#ffffff" stroke-width="2" />
    <polygon points="30,80 80,70 95,130 45,140" fill="#38bdf8" opacity="0.8" stroke="#bae6fd" stroke-width="1.5" />
    <polygon points="100,90 150,75 165,135 115,150" fill="#bae6fd" opacity="0.9" stroke="#ffffff" stroke-width="2" />

    <!-- Glass reflections / glints -->
    <polygon points="130,50 133,58 141,60 133,62 130,70 127,62 119,60 127,58" fill="#ffffff" />
    <polygon points="65,55 67,61 73,63 67,65 65,71 63,65 57,63 63,61" fill="#ffffff" />
  </g>

  <!-- Badge Overlay -->
  <rect x="480" y="490" width="270" height="64" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#059669" stroke-width="2" />
  <text x="500" y="520" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">Old Tyres &amp; Glass Cullet</text>
  <text x="500" y="542" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">Bawana &amp; Tikri Border Yards</text>
</svg>
