<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEwaste" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021f18" />
      <stop offset="50%" stop-color="#063529" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pcbGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldTraces" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgEwaste)" />

  <circle cx="400" cy="300" r="260" fill="#10b981" fill-opacity="0.12" filter="blur(60px)" />
  <circle cx="600" cy="200" r="180" fill="#38bdf8" fill-opacity="0.1" filter="blur(50px)" />

  <!-- Main Motherboard / PCB Slab -->
  <g transform="translate(180, 140) rotate(-6)">
    <rect x="0" y="0" width="440" height="290" rx="16" fill="url(#pcbGreen)" stroke="#059669" stroke-width="4" />
    
    <!-- Gold Edge Connectors (RAM fingers) -->
    <g transform="translate(40, 275)">
      <rect x="0" y="0" width="8" height="15" fill="url(#goldTraces)" />
      <rect x="14" y="0" width="8" height="15" fill="url(#goldTraces)" />
      <rect x="28" y="0" width="8" height="15" fill="url(#goldTraces)" />
      <rect x="42" y="0" width="8" height="15" fill="url(#goldTraces)" />
      <rect x="56" y="0" width="8" height="15" fill="url(#goldTraces)" />
      <rect x="70" y="0" width="8" height="15" fill="url(#goldTraces)" />
      <rect x="84" y="0" width="8" height="15" fill="url(#goldTraces)" />
      <rect x="98" y="0" width="8" height="15" fill="url(#goldTraces)" />
      <rect x="120" y="0" width="8" height="15" fill="url(#goldTraces)" />
      <rect x="134" y="0" width="8" height="15" fill="url(#goldTraces)" />
      <rect x="148" y="0" width="8" height="15" fill="url(#goldTraces)" />
      <rect x="162" y="0" width="8" height="15" fill="url(#goldTraces)" />
    </g>

    <!-- CPU Socket / Chip -->
    <rect x="60" y="60" width="110" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <rect x="85" y="85" width="60" height="60" rx="4" fill="#0f172a" stroke="url(#goldTraces)" stroke-width="2" />
    <text x="96" y="120" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8">CPU</text>

    <!-- RAM Slots -->
    <rect x="210" y="40" width="18" height="160" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <rect x="240" y="40" width="18" height="160" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <rect x="213" y="55" width="12" height="130" rx="2" fill="#34d399" />

    <!-- Capacitors (Silver Cylinders) -->
    <circle cx="310" cy="70" r="14" fill="#e2e8f0" stroke="#334155" stroke-width="2" />
    <circle cx="345" cy="70" r="14" fill="#e2e8f0" stroke="#334155" stroke-width="2" />
    <circle cx="310" cy="110" r="14" fill="#e2e8f0" stroke="#334155" stroke-width="2" />
    <circle cx="345" cy="110" r="14" fill="#e2e8f0" stroke="#334155" stroke-width="2" />
    <circle cx="310" cy="150" r="14" fill="#e2e8f0" stroke="#334155" stroke-width="2" />

    <!-- PCB Traces (Glowing Cyan/Gold Circuit lines) -->
    <path d="M 170 115 L 210 115" stroke="#34d399" stroke-width="3" fill="none" />
    <path d="M 115 170 L 115 220 L 180 220 L 180 250" stroke="url(#goldTraces)" stroke-width="3" fill="none" />
    <path d="M 280 200 L 380 200 L 380 160" stroke="#38bdf8" stroke-width="3" fill="none" />
    <circle cx="180" cy="250" r="4" fill="#facc15" />
    <circle cx="380" cy="160" r="4" fill="#38bdf8" />
  </g>

  <!-- Inverter Lead-Acid Battery Casing -->
  <g transform="translate(100, 360)">
    <rect x="0" y="20" width="160" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="3" />
    <!-- Terminals (+ and -) -->
    <rect x="25" y="5" width="20" height="15" rx="3" fill="#dc2626" />
    <rect x="115" y="5" width="20" height="15" rx="3" fill="#2563eb" />
    <text x="31" y="17" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">+</text>
    <text x="122" y="17" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">-</text>
    <text x="40" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">BATTERY SCRAP</text>
  </g>

  <!-- Badge Overlay -->
  <rect x="490" y="490" width="260" height="64" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#059669" stroke-width="2" />
  <text x="510" y="520" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">E-Waste &amp; Battery Scrap</text>
  <text x="510" y="542" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Nehru Place &amp; Mandoli Hubs</text>
</svg>
