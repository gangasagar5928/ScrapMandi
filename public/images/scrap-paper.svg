<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a18" />
      <stop offset="50%" stop-color="#1e2925" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="kraftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="whitePaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgPaper)" />

  <circle cx="400" cy="300" r="250" fill="#10b981" fill-opacity="0.1" filter="blur(60px)" />
  <circle cx="200" cy="200" r="180" fill="#d97706" fill-opacity="0.08" filter="blur(50px)" />

  <!-- Baled OCC Corrugated Cardboard Blocks -->
  <g transform="translate(180, 160)">
    <!-- Bale 1 -->
    <polygon points="100,60 280,20 380,80 200,120" fill="#b45309" stroke="#78350f" stroke-width="3" />
    <polygon points="100,60 200,120 200,260 100,200" fill="#92400e" stroke="#78350f" stroke-width="3" />
    <polygon points="200,120 380,80 380,220 200,260" fill="#78350f" stroke="#451a03" stroke-width="3" />

    <!-- Corrugated Texture Lines -->
    <line x1="200" y1="140" x2="380" y2="100" stroke="#b45309" stroke-width="2" />
    <line x1="200" y1="160" x2="380" y2="120" stroke="#b45309" stroke-width="2" />
    <line x1="200" y1="180" x2="380" y2="140" stroke="#b45309" stroke-width="2" />
    <line x1="200" y1="200" x2="380" y2="160" stroke="#b45309" stroke-width="2" />
    <line x1="200" y1="220" x2="380" y2="180" stroke="#b45309" stroke-width="2" />
    <line x1="200" y1="240" x2="380" y2="200" stroke="#b45309" stroke-width="2" />

    <!-- Steel Strapping Wire around Bale -->
    <line x1="140" y1="84" x2="140" y2="224" stroke="#10b981" stroke-width="4" />
    <line x1="260" y1="107" x2="260" y2="247" stroke="#10b981" stroke-width="4" />
    <line x1="320" y1="93" x2="320" y2="233" stroke="#10b981" stroke-width="4" />
  </g>

  <!-- Office White Record Paper Stacks -->
  <g transform="translate(460, 280) rotate(12)">
    <rect x="0" y="0" width="160" height="110" rx="4" fill="url(#whitePaper)" stroke="#94a3b8" stroke-width="3" />
    <rect x="5" y="-12" width="155" height="110" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
    <rect x="10" y="-24" width="150" height="110" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
    <!-- Text Lines Placeholder -->
    <line x1="25" y1="-8" x2="110" y2="-8" stroke="#cbd5e1" stroke-width="3" />
    <line x1="25" y1="6" x2="140" y2="6" stroke="#cbd5e1" stroke-width="3" />
    <line x1="25" y1="20" x2="130" y2="20" stroke="#cbd5e1" stroke-width="3" />
  </g>

  <!-- Newspaper / Akhbaar bundle -->
  <g transform="translate(100, 340) rotate(-10)">
    <rect x="0" y="0" width="170" height="100" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="3" />
    <rect x="10" y="10" width="70" height="80" fill="#cbd5e1" />
    <line x1="90" y1="20" x2="155" y2="20" stroke="#475569" stroke-width="4" />
    <line x1="90" y1="35" x2="155" y2="35" stroke="#94a3b8" stroke-width="2" />
    <line x1="90" y1="45" x2="155" y2="45" stroke="#94a3b8" stroke-width="2" />
    <line x1="90" y1="55" x2="155" y2="55" stroke="#94a3b8" stroke-width="2" />
    <!-- Jute rope knot -->
    <line x1="85" y1="-5" x2="85" y2="105" stroke="#d97706" stroke-width="4" />
    <line x1="-5" y1="50" x2="175" y2="50" stroke="#d97706" stroke-width="4" />
  </g>

  <!-- Recycling Loop Badge -->
  <g transform="translate(370, 70)">
    <circle cx="35" cy="35" r="32" fill="#065f46" stroke="#10b981" stroke-width="3" />
    <!-- Recycling triangle arrows -->
    <path d="M 35 18 L 48 38 L 40 38 L 40 46 L 30 46 L 30 38 L 22 38 Z" fill="#34d399" />
  </g>

  <!-- Badge Overlay -->
  <rect x="500" y="490" width="250" height="64" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#059669" stroke-width="2" />
  <text x="520" y="520" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">OCC Gatta &amp; Raddi Paper</text>
  <text x="520" y="542" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">Bawana &amp; Narela Mills</text>
</svg>
